services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sonder
      POSTGRES_PASSWORD: sonder
      POSTGRES_DB: sonder_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./migrations/001_core.sql:/docker-entrypoint-initdb.d/01-core.sql:ro
      - ./migrations/002_security_boundaries.sql:/docker-entrypoint-initdb.d/02-security.sql:ro
      - ./migrations/003_identity_and_idempotency.sql:/docker-entrypoint-initdb.d/03-identity.sql:ro
      # Last: the migrations create the service roles without a password, so
      # the suite has to give them one before it can connect as them.
      - ./tests/sql/roles.sql:/docker-entrypoint-initdb.d/04-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonder -d sonder_test"]
      interval: 2s
      timeout: 3s
      retries: 30
