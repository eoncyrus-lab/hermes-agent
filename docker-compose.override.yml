# Local hybrid run. Docker provides PostgreSQL and nothing else:
#
#   db      - the only container. Already-pulled image, no build required.
#   redis   - NOT started. The Homebrew redis service is already listening on
#             127.0.0.1:6379 with no password, so SONDER_REDIS_URL points there.
#   api / worker / bot
#           - NOT started. All three run from .venv on the host, which is what
#             avoids the image build entirely.
#
# The base compose file deliberately does not publish 5432 -- as its comment
# puts it, "a published 5432 on a laptop is a published 5432 on whatever
# network that laptop joins next". Binding to 127.0.0.1 keeps that property
# while letting a host process connect. docker-compose.test.yml already
# publishes its test database the same way.
#
# Delete this file to return to the containerised deployment.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
