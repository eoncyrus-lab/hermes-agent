[project]
name = "sonder"
version = "0.1.0"
description = "A personal relationship intelligence agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # anthropic 1.x removed `temperature` from messages.create(); the provider
    # is written against that shape, so an older SDK would silently sample
    # differently instead of failing. Pin the major.
    "anthropic>=1.2,<2",
    "openai>=3.6,<4",
    "python-telegram-bot>=21.6",
    "arq>=0.26",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.scripts]
sonder = "sonder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.12"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 wants StrEnum. Skipped deliberately: StrEnum changes what str() returns,
# and these enums are serialised in several places. No benefit worth that risk.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]          # re-export modules
"sonder/api/*.py" = ["B008"]         # FastAPI Depends() is a call in a default

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sonder*"]
